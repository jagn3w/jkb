# Continuous integration — mirrors ./scripts/check.sh on every push and pull request so
# both humans and the task-swarm merge queue get a trustworthy green signal (design D30).
# The toolchain is pinned by rust-toolchain.toml (1.96.1); the two live-smoke tests (ollama,
# Chrome) stay #[ignore]d because CI has neither. cargo-deny honours deny.toml, which ignores
# RUSTSEC-2026-0192 (the unmaintained ttf-parser transitive dep, tracked separately).
name: CI

on: [push, pull_request]

# Cancel superseded runs on the same ref so a rapid push sequence doesn't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace pulls heavy transitive deps (fastembed/ONNX, headless_chrome,
      # rav1e/image) and builds them twice (default + --features fastembed) plus a
      # --all-features cargo-deny graph, which overflows the runner's ~14 GB free disk
      # ("No space left on device"). Reclaim ~25 GB from preinstalled SDKs first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/graalvm \
            /usr/local/share/powershell || true
          sudo apt-get clean || true
          df -h /

      # rustup reads rust-toolchain.toml and installs the pinned channel; ensure the
      # rustfmt/clippy components are present for the gates below.
      - name: Install pinned toolchain + components
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (fastembed)
        run: cargo clippy --all-targets --features fastembed -- -D warnings

      - name: test
        run: cargo test --all

      - name: test (fastembed)
        run: cargo test --all --features fastembed

      # The auto-mode posture's tests (design D48). Hermetic and seconds-long: no Rust, no
      # session, no network — they only exercise the JSON merge/subset logic against a temp
      # CLAUDE_CONFIG_DIR. `check.sh` skips them when jq is missing; the runner always has jq,
      # so a local skip never becomes a CI skip.
      - name: auto-mode posture
        run: ./scripts/auto-mode-test.sh

      # The dev container's static configuration checks (design D49): seconds, no Docker needed.
      - name: container config
        run: ./.container/check-config.sh

      # Each of those assertions, watched failing. No Docker needed; the container-level harness
      # (mutate-verify.sh) is the one that cannot run here.
      - name: container config guards fire
        run: ./.container/mutate-config.sh

      # The pure derivations behind the container, each exercised without Docker. They were in
      # scripts/check.sh only — behind a jq guard whose skip text says "CI runs this gate", which
      # was not true: on a machine without jq they ran NOWHERE. A skip is only honest if the thing
      # it defers to actually happens.
      #   run.sh          the docker argument derivation and the staleness fingerprint
      #   entrypoint.sh   the boot decision, against a stubbed firewall raise (D50.3)
      #   init-firew...   the reason it records, and the format the reader parses (D50.2/D51.8)
      #   egress-lib      what "egress is bounded" means — one definition, two callers (D51.1)
      #   egress-status   the live-chain report the entrypoint now boots on (D51.1)
      #   fetch-ext...    the marketplace URL and platform mapping
      #   verify.sh       the mount-exclusion regex
      - name: container derivations
        run: |
          ./.container/run.sh --self-test
          ./.container/entrypoint.sh --self-test
          ./.container/init-firewall.sh --self-test
          ./.container/egress-lib.sh --self-test
          ./.container/egress-status.sh --self-test
          ./.container/fetch-extensions.sh --self-test
          ./.container/verify.sh --self-test
          # Ran in scripts/check.sh and NOWHERE in CI until check-config.sh started comparing the
          # two lists — the exact drift that check exists to catch, found on its first run.
          ./scripts/link-claude-memory.sh --self-test

      # The action defaults to `cargo deny check --all-features`, so feature-gated deps
      # (e.g. the `fastembed` graph) are audited — matching `scripts/check.sh`.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  # The dev container, BUILT AND RUN (design D52). Everything above this job is a statement about
  # the TEXT of the container scripts; this is the only job that executes them.
  #
  # WHY IT DID NOT EXIST UNTIL NOW, which is the whole point of D52. `.container/verify.sh` and
  # `mutate-verify.sh` need a Docker daemon, and the D48 auto-mode posture blankets `~` under
  # `denyRead`, so `~/.docker/bin/docker` is unreachable on the machine this repo is developed on.
  # They were therefore documented as human-run steps — and nobody ran them, for four review rounds
  # and 53 findings. That state is STABLE precisely because it is unrepeatable, which is why the
  # static layer kept growing: it was the only thing the gate could reach.
  #
  # A runner is not under that posture and ships a working rootful daemon. `--cap-add NET_ADMIN`
  # and `--security-opt seccomp=<file>` are ordinary docker-CLI flags here, and the bwrap-nesting
  # measurement this container is built around was taken on Ubuntu/Docker, which is what this is.
  #
  # OPEN QUESTION THIS JOB EXISTS TO SETTLE (D52.2, tasks 1.3): whether bubblewrap can create its
  # namespaces under a runner's kernel — verify.sh asserts it directly. If it cannot, the honest
  # response is to skip THAT assertion by name and say so, not to weaken the job; everything else
  # here (the firewall raise, ~24 verify.sh assertions, every mutation) is exercised regardless.
  # Nothing has been deleted from the static layer against this job, and nothing will be until it
  # has been observed green.
  container:
    runs-on: ubuntu-latest
    env:
      # BUBBLEWRAP IS A KNOWN FAILURE ON THIS HOST CLASS, declared by name rather than skipped.
      # verify.sh still reports it at full volume every run, with bwrap's own error and the host
      # settings; what this changes is the exit code, so the other ~24 assertions and every
      # mutation stay readable instead of being blocked behind one open investigation.
      #
      # It is NOT a workaround for a CI quirk. The container fails the same way on any stock-Docker
      # AppArmor host, which is most Linux machines, so this is a real limitation of D49's "both
      # layers" claim -- tracked as its own change, not papered over here. Remove this line the day
      # that is fixed, and the stock-seccomp mutation becomes meaningful again with it.
      JKB_ACCEPT_NO_BWRAP: '1'

    # The build is minutes and the harness starts ~13 containers; a wedged docker pull would
    # otherwise sit for the runner's six-hour default. Generous enough that a slow-but-working
    # run is not reported as a broken one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The image carries a Rust toolchain, the Claude CLI and the pinned VS Code extensions, so
      # it is a genuinely large build (~4 GB, several minutes). Deliberately NOT cached on the
      # first pass: a cache that silently serves a stale image would make this job report on
      # something other than the committed Dockerfile, which is the failure mode the job exists to
      # remove. Revisit once it has a track record.
      - name: Build the image
        run: docker build -t jkb-dev .container

      # ONE HEALTHY CONTAINER, with the real flags and the real preamble. Deliberately reuses
      # mutate-verify.sh's own --control rather than spelling a `docker run` here: a hand-rolled
      # one omitted the seccomp profile, NET_ADMIN, the binds and the firewall-raising preamble,
      # and produced a dozen FAILs that read as a broken container instead of as a wrong command.
      # "Is the container healthy" and "did that guard fire" must not be answerable about two
      # different containers.
      - name: The container is what it claims to be
        run: ./.container/mutate-verify.sh --control

      # WHY BUBBLEWRAP CAN OR CANNOT START. The first real run answered D52 task 1.3 with a FAIL:
      # `bubblewrap cannot create namespaces`. That is the nested sandbox's mechanism, so it needs
      # a cause and not a skip — the seccomp profile IS applied by the flags above (docker errors
      # on a missing profile file), so something else is refusing.
      #
      # This step DELIBERATELY assembles its own docker flags, which the diagnostic below does not:
      # varying the flags IS the experiment. [2] is exactly what the container ships, so if [3]
      # succeeds where [2] fails the cause is AppArmor — Ubuntu 24.04 (which ubuntu-latest is)
      # restricts unprivileged user namespaces by default, and the design's own measurement was
      # taken on 26.04. Reported, never acted on automatically: `apparmor=unconfined` is a real
      # weakening of the container and is a decision, not a fix to apply because a probe suggested it.
      - name: Why bubblewrap can or cannot start (settles task 1.3)
        if: always()
        run: |
          echo "--- runner facts ---"; uname -a
          for s in kernel.unprivileged_userns_clone user.max_user_namespaces \
                   kernel.apparmor_restrict_unprivileged_userns; do
            printf '%s = %s\n' "$s" "$(sysctl -n $s 2>&1 || true)"
          done
          SEC=.container/seccomp-bwrap.json
          # --entrypoint bash, deliberately. The first version of this probe kept the image's
          # entrypoint, which refuses to boot when egress is unbounded -- and these arms grant no
          # NET_ADMIN, so all three printed the refusal and bwrap never ran. Three identical
          # outputs that discriminated nothing, in the experiment written to settle the question.
          # The entrypoint is an unrelated moving part here: bwrap's namespace creation depends on
          # the kernel, seccomp, AppArmor and capabilities, not on what PID 1 is.
          probe() { # probe <label> <extra docker args...>
            local label="$1"; shift
            local out
            out="$(docker run --rm --entrypoint bash "$@" jkb-dev -c \
                    'bwrap --new-session --die-with-parent --bind / / --unshare-net /bin/true \
                       && echo BWRAP-OK || echo BWRAP-FAILED' 2>&1)"
            # AN ARM THAT DID NOT RUN SAYS SO, rather than being read as a result. This is the
            # whole lesson of the previous version: "no BWRAP-OK in the output" and "the probe
            # never executed" are different facts and must not print the same way.
            case "$out" in
              *BWRAP-OK*)     printf '%-30s OK\n' "$label" ;;
              *BWRAP-FAILED*) printf '%-30s FAILED\n' "$label"
                              printf '%s\n' "$out" | grep -v BWRAP- | sed 's/^/      /' | tail -3 ;;
              *)              printf '%-30s DID NOT RUN - this arm measured NOTHING:\n' "$label"
                              printf '%s\n' "$out" | sed 's/^/      /' | tail -5 ;;
            esac
          }
          probe "[1] stock docker"        --user vscode
          probe "[2] + seccomp"           --user vscode --security-opt seccomp=$SEC
          probe "[3] + apparmor=unconfined" --user vscode --security-opt seccomp=$SEC \
                                            --security-opt apparmor=unconfined

      # WHAT THE MEMORY LINKER ACTUALLY SAYS. The other FAIL was `auto-memory is not linked (state:
      # unlinked)`, and the preamble runs the linker with its output sent to /dev/null, so the run
      # reported the state without the reason. Re-running it verbosely in the SAME container the
      # control uses is the whole diagnostic — and it goes through `--shell` rather than a
      # hand-assembled `docker run` precisely because this one is not an experiment about flags.
      - name: What the memory linker actually says
        if: always()
        run: |
          ./.container/mutate-verify.sh --shell '
            echo "--- linker, verbose (the preamble already ran it quietly) ---"
            ./scripts/link-claude-memory.sh; echo "linker exit=$?"
            echo "--- what it reports for this repo ---"
            ./scripts/link-claude-memory.sh --status /home/vscode/repos/jkb
            echo "--- the paths it works over ---"
            ls -ld /home/vscode/.claude /home/vscode/.claude/projects /home/vscode/.jkb 2>&1
            ls -la /home/vscode/.jkb 2>&1 | head -5'

      # ...and every one of those assertions watched failing. This harness has NEVER executed:
      # each of its mutations breaks one property (an undeclared mount, the host ~/.claude mounted,
      # stock seccomp, no NET_ADMIN, running as root, the sudoers grant restored) and requires
      # verify.sh to fail naming it, with a negative control proving the matcher discriminates.
      #
      # `if: always()` so a failing control does not hide whether the guards themselves work —
      # those are different questions, and the first real run needs both answered in one go.
      - name: Every container guard, watched failing
        if: always()
        run: ./.container/mutate-verify.sh

  # The `ui/` pnpm workspace, gated separately: it needs neither the Rust toolchain nor the
  # disk cleanup above, so it runs in parallel and fails fast on its own.
  #
  # This job exists because `scripts/check.sh` *skips* the UI when pnpm is missing. A skip
  # locally must not become a skip in CI, or a type error merges on a green tick.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # pnpm only (never npm): the store is content-addressed and the lockfile is
      # pnpm-lock.yaml. `--frozen-lockfile` fails rather than silently resolving new versions.
      # Pin from ui/package.json's `packageManager` rather than a floating major. The
      # workspace config is version-sensitive — pnpm 11 renamed `onlyBuiltDependencies` to
      # `allowBuilds`, and reading the wrong key fails the install outright — so CI must run
      # the version the config was written for.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      # `build` is the whole gate: each package type-checks before emitting, and `pnpm -r`
      # runs topologically so @jkb/core's .d.ts exists before the adapter checks against it.
      # (`pnpm -r run typecheck` alone is NOT equivalent — every typecheck is --noEmit, so on
      # a clean checkout nothing produces that .d.ts and the adapter cannot resolve it.)
      - name: build (type-checks)
        run: pnpm run build
