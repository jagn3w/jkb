[package]
name = "jkb-mcp"
description = "MCP server exposing the KB to agents (read + audited write tools)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.103"
jkb-core = { version = "0.1.0", path = "../jkb-core" }
jkb-embed = { version = "0.1.0", path = "../jkb-embed" }
jkb-index = { version = "0.1.0", path = "../jkb-index" }
jkb-ingest = { version = "0.1.0", path = "../jkb-ingest" }
jkb-search = { version = "0.1.0", path = "../jkb-search" }
jkb-types = { version = "0.1.0", path = "../jkb-types" }
rmcp = { version = "2.0.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.27.0"
