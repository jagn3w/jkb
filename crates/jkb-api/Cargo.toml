[package]
name = "jkb-api"
description = "Typed operations over the knowledge base: the Request/Response vocabulary and the Backend seam a local process and (later) the host daemon share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Design updates and state vectors cross the wire as base64 (D53.4).
base64 = "0.22.1"
jkb-core = { version = "0.1.0", path = "../jkb-core" }
jkb-fsm = { version = "0.1.0", path = "../jkb-fsm" }
jkb-rbac = { version = "0.1.0", path = "../jkb-rbac" }
jkb-embed = { version = "0.1.0", path = "../jkb-embed" }
jkb-index = { version = "0.1.0", path = "../jkb-index" }
jkb-ingest = { version = "0.1.0", path = "../jkb-ingest" }
jkb-search = { version = "0.1.0", path = "../jkb-search" }
jkb-sync = { version = "0.1.0", path = "../jkb-sync" }
jkb-types = { version = "0.1.0", path = "../jkb-types" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
# A peer editor in the design tests, writing updates as the app's `yjs` does.
yrs = "0.28.0"
