[package]
name = "jkb-daemon"
description = "jkb serve: the host daemon that owns jkb.db and serves jkb-api operations over HTTP, and the RemoteBackend client the dev container uses to reach it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# Every dependency below is already in Cargo.lock (reqwest pulls hyper/tokio/http), so this crate
# fetches nothing new — which matters because crates.io is unreachable from the agent sandbox.
[dependencies]
bytes = "1.12.0"
getrandom = "0.2.17"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
jkb-api = { version = "0.1.0", path = "../jkb-api" }
jkb-core = { version = "0.1.0", path = "../jkb-core" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
