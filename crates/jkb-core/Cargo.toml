[package]
name = "jkb-core"
description = "Virtual-filesystem source of truth: schema, migrations, writer-actor, repositories, changelog, query engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.5"
jkb-fsm = { version = "0.1.0", path = "../jkb-fsm" }
jkb-types = { version = "0.1.0", path = "../jkb-types" }
refinery = { version = "0.9.2", features = ["rusqlite"] }
rusqlite = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1.25"

# `statfs`, for refusing a database on a filesystem shared with another kernel (src/shared_fs.rs, Linux),
# and the `openat` walk that keeps sync from following a symbolic link (src/nofollow.rs, every Unix —
# declared for Linux alone, it did not build on macOS). The same version jkb-cli already locks, so
# nothing new is fetched.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
proptest.workspace = true
tempfile = "3.27.0"
