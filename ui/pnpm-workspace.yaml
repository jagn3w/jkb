packages:
  - core
  - vscode
  - app

# Dependency install scripts pnpm may run. pnpm blocks them by default (supply-chain defence),
# and these are the only ones allowed here:
# - esbuild: its install script fetches its platform binary; without it nothing bundles (the VS
#   Code adapter, and electron-vite/Vite under the app).
# - electron: its install script downloads the Electron binary from GitHub releases. Where GitHub
#   is unreachable (the agent sandbox) set ELECTRON_SKIP_BINARY_DOWNLOAD=1: type-check and bundle
#   need no binary, and the app's Electron smoke test skips and says why (D53.2).
# - node-pty: the app's terminal PTYs (D53.10). A native module: its install script uses a
#   prebuilt binary where node-pty ships one (macOS, Windows) and otherwise compiles with
#   node-gyp, which downloads Node's headers from nodejs.org. Where that is unreachable (the agent
#   sandbox) install with `npm_config_nodedir=/usr` to compile against the local headers. It is a
#   Node-API module, so the one build loads in Node (the tests) and in Electron (the app) alike.
# - electron-winstaller is DENIED: it arrives with electron-builder (the installed copy, D53.3) and
#   its script only serves Windows installers, which jkb does not build. Denied by name because
#   pnpm 11 fails the install on a build script that is neither allowed nor denied.
#
# Both spellings are kept deliberately: pnpm 11 reads `allowBuilds`, pnpm 10 reads
# `onlyBuiltDependencies`, and a mismatch is not a warning — the install fails with
# ERR_PNPM_IGNORED_BUILDS. Carrying both means either version installs cleanly.
allowBuilds:
  esbuild: true
  electron: true
  node-pty: true
  electron-winstaller: false

# Which platforms' optional dependencies an install links: this machine's, and Linux on this CPU.
# esbuild resolves its binary from a per-platform optional package (`@esbuild/darwin-arm64`,
# `@esbuild/linux-arm64`, …) and pnpm links only the installing machine's by default. The dev
# container bind-mounts the checkout, so it reads the host's `ui/node_modules`: a macOS install left
# it only the darwin binary, and every test that bundles with esbuild (the app's and the VS Code
# adapter's `test/*.test.mjs`) failed in the container with esbuild's "installed for another
# platform" error. Linking Linux too lets the container RUN them against the host's install, without
# ever writing to it. The CPU stays `current`: the container runs on the host's own architecture.
# It does not make the directory shareable for writes — node-pty is compiled in place and Electron
# downloads one platform's binary — so a container BUILD still copies `ui/` out
# (scripts/install-extension.sh --build-in). Takes effect at the host's next `pnpm install`.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current

onlyBuiltDependencies:
  - esbuild
  - electron
  - node-pty

ignoredBuiltDependencies:
  - electron-winstaller

# @codemirror/language 6.13.0 (published 2026-10-07) imports @codemirror/streamparser without
# declaring it, so the app (D53.4) does not bundle with it; 6.13.1 declares it but was a day old.
# Every copy is held at the last 6.12 release, as the app pins it, so lang-markdown resolves the same.
overrides:
  "@codemirror/language": 6.12.4
